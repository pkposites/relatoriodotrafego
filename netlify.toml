[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Produção: plano gerado pela IA no servidor. APP_MODE e PAYWALL das funções ficam no painel da Netlify.
  VITE_APP_MODE = "production"
  # Cobrança desligada por enquanto: Plano grátis com limites diários no servidor.
  # Para voltar a cobrar: VITE_PAYWALL = "on" aqui e PAYWALL=on no painel da Netlify.
  VITE_PAYWALL = "off"
  # Pixel da Meta "Serviços" (ID público). Só carrega após o consentimento do visitante.
  VITE_META_PIXEL_ID = "2018578222100683"
  APP_MODE = "production"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pdfmake é carregado com require dinâmico (fontes embutidas); precisa ir junto.
  external_node_modules = ["pdfmake"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
